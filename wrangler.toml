#:schema node_modules/wrangler/config-schema.json
name = "acmerd-image-manager"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# 自定义域（Zone 在同一 CF 账户下）— 必须位于任何 [section] 之前
routes = [
  { pattern = "image.acmerd.com", custom_domain = true }
]

# SPA 静态资源：构建产物目录；未命中路径回退 index.html（/admin/* 深链）
# run_worker_first = true：Worker 作为入口处理全部请求（/api/* 由 Worker 路由，
#   静态资源经 env.ASSETS.fetch 回源）；wrangler 4.4→4.128 默认改为 false(assets-first)
#   会导致 /api 404 落到 SPA 回退——必须显式 true（V1.3.1 同语义，当时默认即 true）。
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
SUPABASE_URL = "https://ctddbmadywtdufazhwiq.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_NcRTArTwZopEQAH6gb3LJw_VPXCgEG5"
# ---- V1.1 Phase B (PB-1) GitHub Image Repository ----
# GITHUB_TOKEN 一律 wrangler secret put（绝不写进本文件，Gate §12 红线）。
# dry-run 阶段 Owner 将 OWNER/REPO 指向独立 private 演练仓库（Gate Q5 裁决）；
# 全矩阵通过后改指向生产仓库，代码零变更。
GITHUB_IMAGES_OWNER = "acmerd-2nd"
GITHUB_IMAGES_REPO = "-Photo-Acmerd-Image-Manager"
GITHUB_IMAGES_BRANCH = "main"

# 对账 sweeper（Gate §3）：每 10 分钟收敛 uploading/failed/deleting 崩溃窗口
[triggers]
crons = ["*/10 * * * *"]

# V1.9.0 P0-1：Cloudflare Image Resizing（wrangler 4.128 无一等键，走 unsafe.bindings，type="imaging"）。
# 绑定名 IMG = Worker 侧 env.IMG。/api/img 检测到 env.IMG 时按 w/q 缩放回传字节（省字节）。
# 【默认注释掉】：账户若未开通 Image Resizing，取消注释会让真实 deploy 直接失败（连带整版回滚）。
#   注释状态下 /api/img 走「同源反代原图字节」(路径 B)：已修大陆可达性 + 30 天强缓存，仅首访字节不省。
#   待 Owner 确认账户已开通 Image Resizing 后，取消下列三行注释并部署 → 启用路径 (A) 缩放，缩略图字节显著下降。
# [[unsafe.bindings]]
# name = "IMG"
# type = "imaging"


